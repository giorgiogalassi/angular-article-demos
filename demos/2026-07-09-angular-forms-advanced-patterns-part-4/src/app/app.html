<div class="layout">
  <nav class="sidebar">
    <h1><a routerLink="/">{{ title() }}</a></h1>

    @for (section of sections; track section.label) {
      <div class="section">
        <h2>{{ section.label }}</h2>
        <ul>
          @for (link of section.links; track link.path) {
            <li>
              <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
